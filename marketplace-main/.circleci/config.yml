workflows:
  # Workflow: always build images, and then deploy image to dev on all commits to main, and deploy image to stage on
  # all tags that start with `v`.

  continuous-deploy:
    jobs:
      - deploy_branch_server_api:
          filters:
            tags:
              only: /^branch-server.*/
            branches:
              ignore: /.*/

      - deploy_branch_server_investor_dashboard:
          filters:
            tags:
              only: /^branch-server.*/
            branches:
              ignore: /.*/

      - deploy_branch_server_admin_dashboard:
          filters:
            tags:
              only: /^branch-server.*/
            branches:
              ignore: /.*/

      - test_marketplace_api:
          context:
            - sidecar-shared
          filters:
            tags:
              only:
              - /^v.*/
              - /^build.*/
      - build_marketplace_api:
          context:
            - sidecar-shared
          requires:
            - test_marketplace_api
          filters:
            branches:
              only:
                - main
                - production
            tags:
              only:
                - /^v.*/
                - /^build.*/
      - deploy_dev_marketplace_api:
          context:
            - sidecar-shared
          requires:
            - build_marketplace_api
          filters:
            branches:
              only: main
            # NOTE: tag filter is purposefully not added here. CircleCI does not build on tags automatically, so by
            # omitting the tag filter, tags will skip this build step.
      - deploy_stage_marketplace_api:
          context:
            - sidecar-shared
          requires:
            - build_marketplace_api
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - build_investor_dashboard:
          context:
            - sidecar-shared
          requires:
            - test_marketplace_api
          filters:
            branches:
              only:
              - main
              - production
            tags:
              only:
              - /^v.*/
              - /^build.*/
      - deploy_dev_investor_dashboard:
          context:
            - sidecar-shared
          requires:
            - build_investor_dashboard
          filters:
            branches:
              only: main
            # NOTE: tag filter is purposefully not added here. CircleCI does not build on tags automatically, so by
            # omitting the tag filter, tags will skip this build step.
      - deploy_stage_investor_dashboard:
          context:
            - sidecar-shared
          requires:
            - build_investor_dashboard
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - build_sidecar_admin:
          context:
            - sidecar-shared
          requires:
            - test_marketplace_api
          filters:
            branches:
              only:
              - main
              - production
            tags:
              only:
              - /^v.*/
              - /^build.*/
      - deploy_dev_sidecar_admin:
          context:
            - sidecar-shared
          requires:
            - build_sidecar_admin
          filters:
            branches:
              only: main
            # NOTE: tag filter is purposefully not added here. CircleCI does not build on tags automatically, so by
            # omitting the tag filter, tags will skip this build step.
      - deploy_stage_sidecar_admin:
          context:
            - sidecar-shared
          requires:
            - build_sidecar_admin
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
      - build_public_marketplace_frontend:
          context:
            - sidecar-shared
          requires:
            - test_marketplace_api
          filters:
            branches:
              only:
              - main
              - production
            tags:
              only:
              - /^v.*/
              - /^build.*/
      - deploy_dev_public_marketplace_frontend:
          context:
            - sidecar-shared
          requires:
            - build_public_marketplace_frontend
          filters:
            branches:
              only: main
            # NOTE: tag filter is purposefully not added here. CircleCI does not build on tags automatically, so by
            # omitting the tag filter, tags will skip this build step.
      - deploy_stage_public_marketplace_frontend:
          context:
            - sidecar-shared
          requires:
            - build_public_marketplace_frontend
          filters:
            tags:
              only: /^v.*/
            branches:
              ignore: /.*/
