          command: ./backend/_ci/scripts/deploy-docker-image.sh "$REGION" "$CIRCLE_SHA1" "$STAGE_DEPLOY_PATH" "$IMAGE_TAG_VARNAME"

  build_sidecar_admin:
    <<: *sidecar_admin_defaults
    steps:
